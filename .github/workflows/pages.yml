name: Deploy Aurora Bande

on:
  push:
    branches: [main]
  schedule:
    # Ogni 5 minuti: riscarica i dati del magnetometro e ripubblica il sito.
    # Nota: GitHub disabilita automaticamente i workflow schedulati dopo 60
    # giorni senza commit sul repo — un push su main li riattiva.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scarica i dati del magnetometro (FMI IMAGE)
        run: python scripts/update_ground_data.py
      - name: Prepara il sito da pubblicare
        run: |
          mkdir -p site
          cp index.html sole-noaa.html manifest.webmanifest sw.js site/
          cp -r css js icons versione-precedente site/
          cp README.md site/ 2>/dev/null || true
          cp -r data site/
          # le pagine precedenti leggono i magnetometri da data/ relativo alla loro cartella
          cp -r data site/versione-precedente/
      - name: Controlla che il service worker elenchi solo file esistenti
        run: |
          python - <<'PY'
          import re, pathlib
          s = pathlib.Path('site/sw.js').read_text(encoding='utf-8')
          block = s[s.index('const SHELL'):s.index('];', s.index('const SHELL'))]
          files = re.findall(r"'([^']+)'", block)
          missing = [f for f in files if f != './' and not pathlib.Path('site', f).is_file()]
          assert not missing, 'File del service worker mancanti: ' + ', '.join(missing)
          print(len(files), 'file nel guscio, tutti presenti')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
