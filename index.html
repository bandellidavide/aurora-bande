<!doctype html>
<html lang="it" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aurora Bande">
<title>Aurora Bande</title>
<meta name="description" content="Osservatorio aurorale: condizioni misurate a L1, arrivo stimato, cielo e previsioni NOAA. Descrive possibilità, non promette aurore.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js" defer></script>
</head>
<body>
<a class="ab-skip" href="#view">Vai al contenuto</a>

<header class="ab-header">
  <div class="ab-appbar">
    <a class="ab-brand" href="#adesso" aria-label="Aurora Bande, torna ad Adesso">Aurora <b>Bande</b></a>
    <nav class="ab-tabbar ab-navtop" data-variant="top" id="navTop" aria-label="Sezioni"></nav>
    <button type="button" class="ab-place" id="placeBtn" aria-haspopup="dialog" aria-label="Cambia luogo"></button>
    <button type="button" class="ab-btn ab-geo" id="geoHeaderBtn" data-variant="ghost" data-size="icon" aria-label="Usa la mia posizione"></button>
    <button type="button" class="ab-btn ab-bell" id="alertBtn" data-variant="ghost" data-size="icon" aria-haspopup="dialog" aria-label="Avvisi" data-on="false"></button>
    <button type="button" class="ab-btn" id="refreshBtn" data-variant="ghost" data-size="icon" aria-label="Aggiorna i dati"></button>
  </div>
  <div class="ab-statusrow" id="statusRow" aria-live="polite"></div>
</header>

<main id="view" tabindex="-1">
  <section class="ab-view" id="v-adesso" data-view="adesso"></section>
  <section class="ab-view" id="v-fronti" data-view="fronti" hidden></section>
  <section class="ab-view" id="v-cielo" data-view="cielo" hidden></section>
  <section class="ab-view" id="v-webcam" data-view="webcam" hidden></section>
  <section class="ab-view" id="v-giorni" data-view="giorni" hidden></section>
</main>

<nav class="ab-tabbar ab-navbottom" id="navBottom" aria-label="Sezioni"></nav>
<div class="ab-toast" id="toast" role="status" hidden></div>

<dialog class="ab-sheet" id="sheetPlace" aria-labelledby="sheetPlaceTitle"></dialog>
<dialog class="ab-sheet" id="sheetAlerts" aria-labelledby="sheetAlertsTitle"></dialog>
<dialog class="ab-sheet" id="sheetInfo" aria-labelledby="sheetInfoTitle"></dialog>
<dialog class="ab-sheet" id="sheetCredits" aria-labelledby="sheetCreditsTitle"></dialog>

<script src="js/core.js"></script>
<script src="js/l1.js"></script>
<script src="js/ground.js"></script>
<script src="js/sky.js"></script>
<script src="js/noaa.js"></script>
<script src="js/alerts.js"></script>
<script src="js/field.js"></script>
<script src="js/minicharts.js"></script>
<script src="js/hypo.js"></script>
<script src="js/credits.js"></script>
<script src="js/ui.js"></script>
<script src="js/pwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>
